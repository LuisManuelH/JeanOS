server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy de /api/ y /healthz → backend K8s service
    # En K8s, jeanos-backend-service resuelve por DNS interno del cluster
    location /api/ {
        proxy_pass http://jeanos-backend-service:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location /healthz {
        proxy_pass http://jeanos-backend-service:3000/healthz;
    }

    # Angular SPA routing — cualquier ruta que no sea archivo → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache de assets compilados (Angular genera hashes en los nombres)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Seguridad básica
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
}
