---
# =============================================================================
# Playbook: Instalación de Kubernetes con kubeadm
#  Master + 2 Workers
# -----------------------------------------------------------------------------
# PLAY 1 — Distribuir /etc/hosts y validar resolución de nombres
# -----------------------------------------------------------------------------
- name: Copiar /etc/hosts a todos los nodos
  hosts: k8s_cluster
  become: yes

  tasks:
    - name: Hacer backup del /etc/hosts actual
      copy:
        src: /etc/hosts
        dest: "/etc/hosts.backup.{{ ansible_date_time.epoch }}"
        remote_src: yes
        mode: '0644'
      tags: hosts

    - name: Copiar /etc/hosts desde el master a todos los nodos
      copy:
        src: /etc/hosts
        dest: /etc/hosts
        owner: root
        group: root
        mode: '0644'
        backup: yes
      tags: hosts

    - name: Verificar contenido de /etc/hosts
      command: cat /etc/hosts
      register: hosts_content
      changed_when: false
      tags: hosts

    - name: Mostrar /etc/hosts actualizado
      debug:
        msg: "{{ hosts_content.stdout_lines }}"
      tags: hosts

    - name: Validar resolución de nombres del cluster
      shell: |
        getent hosts k8s-master01 || echo "FALLO: k8s-master01"
        getent hosts k8s-worker01 || echo "FALLO: k8s-worker01"
        getent hosts k8s-worker02 || echo "FALLO: k8s-worker02"
      register: dns_check
      changed_when: false
      failed_when: "'FALLO' in dns_check.stdout"
      tags: hosts


# -----------------------------------------------------------------------------
# PLAY 2 — Preparar todos los nodos (master + workers)
# -----------------------------------------------------------------------------
- name: Preparar todos los nodos para Kubernetes
  hosts: k8s_cluster
  become: yes
  vars:
    k8s_version: "v1.28"

  tasks:
    - name: Instalar dependencias previas
      dnf:
        name:
          - python3-libselinux
          - iproute-tc
          - dnf-plugins-core
        state: present

    - name: Deshabilitar SELinux (runtime)
      command: setenforce 0
      failed_when: false
      changed_when: false

    - name: Deshabilitar SELinux (persistente)
      selinux:
        state: disabled

    - name: Deshabilitar swap (runtime)
      command: swapoff -a
      changed_when: false

    - name: Deshabilitar swap (persistente en fstab)
      replace:
        path: /etc/fstab
        regexp: '^([^#].*\s+swap\s+.*)$'
        replace: '#\1'

    - name: Configurar módulos del kernel al arranque
      copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter
        mode: '0644'

    - name: Cargar módulos del kernel ahora
      modprobe:
        name: "{{ item }}"
      loop:
        - overlay
        - br_netfilter

    - name: Configurar parámetros sysctl para Kubernetes
      copy:
        dest: /etc/sysctl.d/k8s.conf
        content: |
          net.bridge.bridge-nf-call-iptables  = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward                 = 1
        mode: '0644'

    - name: Aplicar sysctl
      command: sysctl --system

    - name: Agregar repositorio Docker (para containerd)
      get_url:
        url: https://download.docker.com/linux/centos/docker-ce.repo
        dest: /etc/yum.repos.d/docker-ce.repo
        mode: '0644'

    - name: Instalar containerd
      dnf:
        name: containerd.io
        state: present

    - name: Crear directorio de configuración de containerd
      file:
        path: /etc/containerd
        state: directory
        mode: '0755'

    - name: Generar configuración default de containerd
      shell: containerd config default > /etc/containerd/config.toml

    - name: Habilitar plugin CRI en containerd
      replace:
        path: /etc/containerd/config.toml
        regexp: 'disabled_plugins = \["cri"\]'
        replace: 'disabled_plugins = []'

    - name: Activar SystemdCgroup en containerd
      replace:
        path: /etc/containerd/config.toml
        regexp: 'SystemdCgroup = false'
        replace: 'SystemdCgroup = true'

    - name: Reiniciar y habilitar containerd
      systemd:
        name: containerd
        state: restarted
        enabled: yes
        daemon_reload: yes

    - name: Agregar repositorio de Kubernetes {{ k8s_version }}
      copy:
        dest: /etc/yum.repos.d/kubernetes.repo
        content: |
          [kubernetes]
          name=Kubernetes
          baseurl=https://pkgs.k8s.io/core:/stable:/{{ k8s_version }}/rpm/
          enabled=1
          gpgcheck=1
          gpgkey=https://pkgs.k8s.io/core:/stable:/{{ k8s_version }}/rpm/repodata/repomd.xml.key
          exclude=kubelet kubeadm kubectl cri-tools kubernetes-cni
        mode: '0644'

    - name: Instalar kubelet, kubeadm y kubectl
      dnf:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        disable_excludes: kubernetes

    - name: Habilitar e iniciar kubelet
      systemd:
        name: kubelet
        state: started
        enabled: yes


# -----------------------------------------------------------------------------
# PLAY 3 — Firewall en todos los nodos
# -----------------------------------------------------------------------------
- name: Activar firewalld en todos los nodos
  hosts: k8s_cluster
  become: yes

  tasks:
    - name: Asegurar que firewalld está activo
      systemd:
        name: firewalld
        state: started
        enabled: yes


# -----------------------------------------------------------------------------
# PLAY 4 — Puertos del Master (Control Plane)
# -----------------------------------------------------------------------------
- name: Configurar firewall en Master
  hosts: k8s_master
  become: yes

  tasks:
    - name: Abrir puertos del Master
      firewalld:
        port: "{{ item }}"
        permanent: yes
        immediate: yes
        state: enabled
      loop:
        - 6443/tcp       # Kubernetes API Server
        - 2379-2380/tcp  # etcd server client API
        - 10250/tcp      # kubelet API
        - 10251/tcp      # kube-scheduler
        - 10252/tcp      # kube-controller-manager
        - 10255/tcp      # kubelet read-only (métricas)
        - 8285/udp       # Flannel UDP backend
        - 8472/udp       # Flannel VXLAN


# -----------------------------------------------------------------------------
# PLAY 5 — Puertos de los Workers
# -----------------------------------------------------------------------------
- name: Configurar firewall en Workers
  hosts: k8s_workers
  become: yes

  tasks:
    - name: Abrir puertos de Workers
      firewalld:
        port: "{{ item }}"
        permanent: yes
        immediate: yes
        state: enabled
      loop:
        - 10250/tcp        # kubelet API
        - 30000-32767/tcp  # NodePort Services
        - 8285/udp         # Flannel UDP backend
        - 8472/udp         # Flannel VXLAN


# -----------------------------------------------------------------------------
# PLAY 6 — Inicializar Master Node
# -----------------------------------------------------------------------------
- name: Inicializar Master Node
  hosts: k8s_master
  become: yes
  vars:
    pod_network_cidr: "10.244.0.0/16"   # Requerido por Flannel
    flannel_version: "v0.25.1"

  tasks:
    - name: Verificar si el cluster ya está inicializado
      stat:
        path: /etc/kubernetes/admin.conf
      register: kubeadm_conf

    - name: Inicializar cluster con kubeadm
      shell: |
        kubeadm init \
          --pod-network-cidr={{ pod_network_cidr }} \
          --apiserver-advertise-address={{ ansible_host }}
      when: not kubeadm_conf.stat.exists

    - name: Crear directorio .kube para root
      file:
        path: /root/.kube
        state: directory
        mode: '0700'

    - name: Copiar kubeconfig
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /root/.kube/config
        remote_src: yes
        owner: root
        group: root
        mode: '0600'

    - name: Verificar si Flannel ya está instalado
      shell: kubectl get pods -n kube-flannel 2>/dev/null | grep -c flannel || echo "0"
      register: flannel_check
      changed_when: false

    - name: Instalar Flannel CNI {{ flannel_version }}
      shell: |
        kubectl apply -f https://github.com/flannel-io/flannel/releases/download/{{ flannel_version }}/kube-flannel.yml
      when: flannel_check.stdout == "0"

    - name: Esperar a que Flannel esté corriendo
      shell: |
        for i in {1..30}; do
          READY=$(kubectl get pods -n kube-flannel --no-headers 2>/dev/null | grep -c "Running" || echo 0)
          if [ "$READY" -gt 0 ]; then
            echo "Flannel está corriendo"
            exit 0
          fi
          sleep 2
        done
        exit 1
      when: flannel_check.stdout == "0"
      changed_when: false

    - name: Generar token de join fresco
      shell: kubeadm token create --print-join-command
      register: join_command
      changed_when: true

    - name: Guardar join command como fact del master
      set_fact:
        k8s_join_command: "{{ join_command.stdout }}"

    - name: Mostrar comando de join
      debug:
        msg: "Comando de join: {{ join_command.stdout }}"


# -----------------------------------------------------------------------------
# PLAY 7 — Unir Workers al Cluster
# -----------------------------------------------------------------------------
- name: Unir Workers al Cluster
  hosts: k8s_workers
  become: yes

  tasks:
    - name: Verificar si el nodo ya está en el cluster
      shell: kubectl get nodes | grep {{ inventory_hostname }} || echo "not_found"
      register: node_check
      delegate_to: "{{ groups['k8s_master'][0] }}"
      changed_when: false
      failed_when: false

    - name: Mostrar estado actual del nodo
      debug:
        msg: "Nodo {{ inventory_hostname }}: {{ 'Ya está en el cluster, se omite' if 'not_found' not in node_check.stdout else 'Será agregado al cluster' }}"

    - name: Reset kubeadm si el nodo ya intentó unirse antes
      command: kubeadm reset -f
      when: "'not_found' in node_check.stdout"

    - name: Limpiar configuración previa de CNI y kubelet
      shell: |
        rm -rf /etc/cni/net.d/*
        rm -rf /var/lib/kubelet/*
        rm -rf /var/lib/etcd/*
      when: "'not_found' in node_check.stdout"

    - name: Reiniciar containerd y kubelet
      systemd:
        name: "{{ item }}"
        state: restarted
      loop:
        - containerd
        - kubelet
      when: "'not_found' in node_check.stdout"

    - name: Unir worker al cluster
      shell: "{{ hostvars[groups['k8s_master'][0]]['k8s_join_command'] }}"
      register: join_result
      when: "'not_found' in node_check.stdout"

    - name: Mostrar resultado del join
      debug:
        msg: "{{ join_result.stdout_lines }}"
      when:
        - "'not_found' in node_check.stdout"
        - join_result.stdout is defined

    - name: Esperar a que el nodo aparezca en el cluster
      shell: kubectl get nodes | grep {{ inventory_hostname }}
      register: node_verify
      delegate_to: "{{ groups['k8s_master'][0] }}"
      until: node_verify.rc == 0
      retries: 15
      delay: 6
      when: "'not_found' in node_check.stdout"

    - name: Mostrar estado final del nodo
      shell: kubectl get nodes {{ inventory_hostname }} -o wide
      register: node_final
      delegate_to: "{{ groups['k8s_master'][0] }}"
      changed_when: false
      when: "'not_found' in node_check.stdout"

    - name: Imprimir estado final del nodo
      debug:
        msg: "{{ node_final.stdout_lines }}"
      when:
        - "'not_found' in node_check.stdout"
        - node_final.stdout is defined


# -----------------------------------------------------------------------------
# PLAY 8 — Validación final del cluster
# -----------------------------------------------------------------------------
- name: Verificar estado final del cluster
  hosts: k8s_master
  become: yes

  tasks:
    - name: Esperar a que todos los nodos estén Ready
      shell: |
        for i in {1..30}; do
          NOT_READY=$(kubectl get nodes --no-headers 2>/dev/null | grep -c "NotReady" || echo 0)
          echo "Intento $i: $NOT_READY nodos NotReady"
          if [ "$NOT_READY" -eq 0 ]; then
            echo "Todos los nodos están Ready"
            exit 0
          fi
          sleep 5
        done
        exit 1
      register: nodes_wait
      changed_when: false

    - name: Listar todos los nodos del cluster
      command: kubectl get nodes -o wide
      register: final_nodes
      changed_when: false

    - name: Mostrar nodos
      debug:
        msg: "{{ final_nodes.stdout_lines }}"

    - name: Listar pods del sistema
      command: kubectl get pods -n kube-system -o wide
      register: system_pods
      changed_when: false

    - name: Mostrar pods del sistema
      debug:
        msg: "{{ system_pods.stdout_lines }}"

    - name: Reporte final
      debug:
        msg:
          - "============================================="
          - "    Instalación de Kubernetes Completada"
          - "============================================="
          - "  Master : k8s-master01"
          - "  Workers: k8s-worker01, k8s-worker02"
          - "  CNI    : Flannel v0.25.1"
          - "  Firewall configurado en todos los nodos"
          - "============================================="
