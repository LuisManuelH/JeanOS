# Contraseña admin de ArgoCD para el lab (misma idea que Grafana).
# NO va en texto plano: solo hash bcrypt en admin.password.
# Contraseña en claro: jeanos2026  →  cambiar en lab.env + regenerar hash (ver README).
#
# Aplicar DESPUÉS de instalar ArgoCD (deploy-semana4.sh lo hace solo).
apiVersion: v1
kind: Secret
metadata:
  name: argocd-secret
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: argocd
type: Opaque
stringData:
  # bcrypt de "jeanos2026" (htpasswd -nbBC 10 '' jeanos2026)
  admin.password: $2a$10$ByegBN07uU3NzWcQqwuZxurXh/u3ZdRhopDh5jGAJ82V8TzIJhmUm
  admin.passwordMtime: "2026-06-04T00:00:00Z"
