# ArgoCD — sincroniza la tienda jeanOS Shop con el repo del equipo (R6/R7 proyecto final).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jeanos-shop-gitops
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: jeanos-shop
spec:
  project: default
  source:
    repoURL: https://github.com/aliothosa/JeanOS
    targetRevision: lab/equipo
    path: ansible-k8s/manifests/semana-4/jeanos-shop-gitops
  destination:
    server: https://kubernetes.default.svc
    namespace: jeanos-shop
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
