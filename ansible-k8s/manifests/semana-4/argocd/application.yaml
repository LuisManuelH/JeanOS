# ArgoCD Application — despliega demo/ (imagen arm64 de Tekton) desde JeanOS lab/equipo.
# El pipeline Tekton sigue clonando GITHUB_REPO_URL (app/); esta ruta evita imagen amd64 del curso.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mi-tienda
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/aliothosa/JeanOS
    targetRevision: lab/equipo
    path: ansible-k8s/manifests/semana-4/demo
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
