apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-landing
  namespace: semana4-gitops
  labels:
    app: gitops-landing
    app.kubernetes.io/part-of: semana4-gitops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gitops-landing
  template:
    metadata:
      labels:
        app: gitops-landing
    spec:
      containers:
        - name: gitops-landing
          image: emmanuelmal2/semana4-landing:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "100m"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
