apiVersion: v1
kind: Pod
metadata:
  name: test-postgres-pvc
  namespace: jeanos-shop
spec:
  restartPolicy: Never
  containers:
    - name: test
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "PVC NFS funciona desde Kubernetes" > /data/k8s-pvc-test.txt
          cat /data/k8s-pvc-test.txt
          sleep 3600
      volumeMounts:
        - name: postgres-storage
          mountPath: /data
  volumes:
    - name: postgres-storage
      persistentVolumeClaim:
        claimName: postgres-nfs-pvc
